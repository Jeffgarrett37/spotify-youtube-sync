[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-youtube-sync"
version = "1.0.0"
description = "One-way authoritative mirror of a Spotify playlist to a YouTube playlist"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM105/113/102: `try/except/pass` and small nested ifs are clearer as-is here.
ignore = ["E501", "B008", "SIM105", "SIM113", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]

[tool.setuptools]
packages = ["app"]
